name: CI

# Tests Lex on Linux and Windows, and builds the Windows installer and the
# Linux packages. The release workflow calls it with release: true, which
# uploads the packages to the draft release of the tag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Upload the packages to the draft release of the tag
        type: boolean
        default: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build Windows and Linux (amd64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform windows/amd64,linux/amd64
      - name: Collect the packages
        run: |
          version="$(jq -r .version mygo.json)"
          mkdir dist
          cp "build/windows-amd64/Lex Setup $version.exe" "dist/Lex-Setup-$version-windows-amd64.exe"
          cp "build/linux-amd64/lex_${version}_amd64.deb" \
             "build/linux-amd64/lex-$version-linux-amd64.tar.gz" \
             build/linux-amd64/install.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: lex-packages
          path: dist/
          if-no-files-found: error
      - name: Upload to the draft release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Lex $tag" --notes-file .github/release-notes.md --generate-notes
          fi
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
