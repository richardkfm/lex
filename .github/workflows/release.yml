name: Release

# Push a tag vX.Y.Z, or create one with a release on GitHub: Lex is tested,
# built for Windows and Linux at the tag's version, and its packages are
# uploaded to the tag's release. When the tag has no release yet, a draft
# one is made for you to review and publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      # The build takes its version from the tag (ci.yml), and Windows
      # installers need one of numbers.
      - name: The tag is a version, vX.Y.Z
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not a version: name it vX.Y.Z, like v0.2.0"
            exit 1
          fi

  release:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true
